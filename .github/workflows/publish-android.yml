name: Publish EVA Android download

on:
  workflow_run:
    workflows: ["Android ARM64 APK"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download successful Android build
        uses: actions/download-artifact@v4
        with:
          name: SciHubEVA-android-arm64-debug
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify APK, collect optional AAB, and create checksums
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          APK="release-assets/SciHubEVA-android-arm64-debug.apk"
          test -s "$APK"
          mv "$APK" release-assets/EVA-android-arm64.apk
          ASSETS="release-assets/EVA-android-arm64.apk"
          if [[ -s release-assets/EVA-android-arm64-unsigned.aab ]]; then
            ASSETS="$ASSETS release-assets/EVA-android-arm64-unsigned.aab"
          fi
          sha256sum $ASSETS > release-assets/SHA256SUMS.txt
          {
            echo "files<<EOF"
            echo "release-assets/EVA-android-arm64.apk"
            if [[ -s release-assets/EVA-android-arm64-unsigned.aab ]]; then
              echo "release-assets/EVA-android-arm64-unsigned.aab"
            fi
            echo "release-assets/SHA256SUMS.txt"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish stable direct-download release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: EVA Android (latest successful build)
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: ${{ steps.assets.outputs.files }}
